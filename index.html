<style>
:root{
  --bg:#050505;--fg:#fafafa;--muted:rgba(255,255,255,.4);
  --border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.16);
  --panel:rgba(255,255,255,.04);--panel-hover:rgba(255,255,255,.06);
  --soft:rgba(255,255,255,.04);--hover:rgba(255,255,255,.06);
  --active:rgba(255,255,255,.08);
  --nav-bg:rgba(0,0,0,.8);
  --card-bg:#111;--card-border:rgba(255,255,255,.10);
  --card-bg-soft:rgba(255,255,255,.06);
  --thumb-bg:rgba(0,0,0,.25);--inner:rgba(255,255,255,.02);
  --skeleton:rgba(255,255,255,.06);
  --bracket:rgba(255,255,255,.3);--plus:rgba(255,255,255,.7);
  --online:#23a55a;--idle:#f0b232;--dnd:#f23f43;--offline:#80848e;
  --spotify:#1db954;
}
html.light{
  --bg:#fff;--fg:#0a0a0a;--muted:rgba(0,0,0,.45);
  --border:rgba(0,0,0,.10);--border-hover:rgba(0,0,0,.18);
  --panel:rgba(0,0,0,.02);--panel-hover:rgba(0,0,0,.04);
  --soft:rgba(0,0,0,.03);--hover:rgba(0,0,0,.05);
  --active:rgba(0,0,0,.07);
  --nav-bg:rgba(255,255,255,.85);
  --card-bg:#fff;--card-border:rgba(0,0,0,.10);
  --card-bg-soft:rgba(0,0,0,.03);
  --thumb-bg:rgba(0,0,0,.04);--inner:rgba(0,0,0,.015);
  --skeleton:rgba(0,0,0,.06);
  --bracket:rgba(0,0,0,.3);--plus:rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background-color:var(--bg);color:var(--fg);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-weight:300;min-height:100%;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .3s ease,color .3s ease;
  overflow-x:hidden;
  

  background-image: 
    linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.8) 40%, var(--bg) 100%),
    url('https://file.garden/am9m147l3hw3nqT1/Lostboys%20Graffiti%20Tag%20Logo.png');
  background-size: cover;
  background-position: center top;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

html.light body {
  background-image: none;
}

body.intro-active { overflow: hidden; }

img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-9999px;top:0;z-index:200;padding:.5rem 1rem;border-radius:.5rem;background:var(--fg);color:var(--bg);font-size:.875rem;text-decoration:none}
.skip-link:focus{left:1rem;top:1rem;outline:2px solid var(--fg);outline-offset:2px}
:where(a,button,[tabindex]):focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.intro-overlay,
.intro-overlay *,
.intro-overlay *::before,
.intro-overlay *::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

.intro-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:#000;
  opacity:1;
  pointer-events:auto;
  cursor:pointer;
  outline:none;
  transition:opacity .38s cubic-bezier(.16,1,.3,1);
}
.intro-overlay.intro-fade-out{opacity:0;pointer-events:none}
.intro-overlay[hidden]{display:none}

.intro-content{
  position:relative;
  display:grid;
  place-items:center;
  width:100vw;
  height:100vh;
}
.intro-overlay video{
  grid-area:1 / 1;
  width:85vw;
  max-width:580px;
  max-height:75vh;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}
.intro-skip-hint{
  position:fixed;
  bottom:2rem;
  left:50%;
  transform:translateX(-50%);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.75rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
  pointer-events:none;
  animation:introPulse 2s ease-in-out infinite;
}
@keyframes introPulse{
  0%,100%{opacity:.3}
  50%{opacity:.8}
}

.nav{
  position:fixed;left:0;right:0;top:1rem;z-index:50;
  padding:0 1rem;
  animation:dropIn .6s cubic-bezier(.16,1,.3,1) both;
}
@media (min-width:640px){.nav{padding:0 1.5rem}}
@media (min-width:1024px){.nav{padding:0 2rem}}

.nav-inner{
  max-width:72rem;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.375rem;
  border:1px solid var(--border);border-radius:10px;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.nav-right{display:flex;align-items:center;gap:.25rem}

.brand{
  display:flex;align-items:center;justify-content:center;
  padding:.5rem .75rem;border-radius:6px;
  font-size:1.25rem;line-height:1;letter-spacing:.02em;
  text-decoration:none;
  transition:background-color .4s cubic-bezier(.32,.72,0,1);
}
.brand:hover{background:var(--hover)}

.nav-links{display:none;align-items:center;gap:.125rem}
@media (min-width:768px){.nav-links{display:flex}}

.nav-link{
  display:flex;align-items:center;justify-content:center;
  padding:.625rem .875rem;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;text-transform:uppercase;letter-spacing:.18em;
  color:var(--muted);text-decoration:none;
  transition:background-color .4s cubic-bezier(.32,.72,0,1),color .4s cubic-bezier(.32,.72,0,1);
}
.nav-link:hover{background:var(--soft);color:var(--fg)}
.nav-link[aria-current="page"]{background:var(--active);color:var(--fg)}

.divider{display:none;width:1px;height:1.25rem;margin:0 .25rem;background:var(--border)}
@media (min-width:768px){.divider{display:block}}

.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:2.25rem;height:2.25rem;padding:0;
  border-radius:6px;color:var(--muted);
  transition:background-color .4s cubic-bezier(.32,.72,0,1),color .4s cubic-bezier(.32,.72,0,1);
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn svg{width:1rem;height:1rem}

#musicBtn[aria-pressed="true"]{color:var(--fg);background:var(--active)}
#musicBtn[aria-pressed="true"] svg{animation:musicPulse 1.6s ease-in-out infinite}

@keyframes musicPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

.md-only{display:none !important}
@media (min-width:768px){.md-only{display:flex !important}}
.md-hide{display:flex}
@media (min-width:768px){.md-hide{display:none}}

.mobile-menu{
  display:none;flex-direction:column;gap:.125rem;
  max-width:72rem;margin:.5rem auto 0;padding:.375rem;
  border:1px solid var(--border);border-radius:10px;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.mobile-menu.open{display:flex}
.mobile-menu .nav-link{justify-content:flex-start;padding:.75rem .875rem}
@media (min-width:768px){.mobile-menu{display:none}}

.view{display:none}
.view.active{display:block}

.hero{
  position:relative;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:6rem 0 3rem;
}
.container{width:100%;max-width:80rem;margin:0 auto;padding:0 1rem}
@media (min-width:640px){.container{padding:0 1.5rem}}
@media (min-width:1024px){.container{padding:0 2rem}}

.hero-inner{display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center}
@media (min-width:640px){.hero-inner{gap:2rem}}
.hero-logo{width:auto;height:clamp(8rem,26vw,14rem);object-fit:contain}
.hero-copy{
  max-width:48rem;margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;line-height:1.625;color:var(--fg);
}
@media (min-width:640px){.hero-copy{font-size:12px}}
@media (min-width:768px){.hero-copy{font-size:14px}}

.affiliations{position:relative;padding:6rem 0;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:center;margin:0 0 4rem}
.section-title{display:flex;align-items:center;margin:0;font-size:1.875rem;font-weight:300;line-height:1.1}
@media (min-width:640px){.section-title{font-size:2.25rem}}
@media (min-width:768px){.section-title{font-size:3rem}}
.bracket{flex:none;width:2.5rem;height:2.5rem;border:0 solid var(--bracket)}
.bracket.left{border-left-width:1px;border-top-width:1px;border-bottom-width:1px}
.bracket.right{border-right-width:1px;border-top-width:1px;border-bottom-width:1px}
@media (min-width:640px){.bracket{width:3rem;height:3rem}}
@media (min-width:768px){.bracket{width:3.5rem;height:3.5rem}}

.aff-grid{display:grid;grid-template-columns:1fr;gap:1.5rem;max-width:80rem;margin:0 auto}
@media (min-width:640px){.aff-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.aff-grid{grid-template-columns:repeat(3,1fr)}}

.aff-card{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:100%;max-width:24rem;height:30rem;
  margin:0 auto;padding:1rem;
  border:1px solid var(--card-border);
  background:var(--card-bg-soft);
  -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);
  box-shadow:0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -4px rgba(0,0,0,.10);
}
.aff-card .plus{position:absolute;width:1.5rem;height:1.5rem;color:var(--plus);pointer-events:none}
.plus.tl{top:-.75rem;left:-.75rem}.plus.bl{bottom:-.75rem;left:-.75rem}
.plus.tr{top:-.75rem;right:-.75rem}.plus.br{bottom:-.75rem;right:-.75rem}
.aff-face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1rem;text-align:center;
  transition:opacity .25s ease,transform .25s ease;
}
.aff-front{opacity:1}
.aff-back{opacity:0}
.aff-card:hover .aff-front,
.aff-card:focus-within .aff-front{opacity:0;transform:translateY(-1rem)}
.aff-card:hover .aff-back,
.aff-card:focus-within .aff-back{opacity:1;transform:translateY(-1rem)}
.aff-icon{width:3rem;height:3rem;color:var(--fg);opacity:.7}
@media (min-width:640px){.aff-icon{width:3.5rem;height:3.5rem}}
@media (min-width:768px){.aff-icon{width:4rem;height:4rem}}
.aff-back img{width:18rem;height:18rem;object-fit:contain}
@media (min-width:640px){.aff-back img{width:20rem;height:20rem}}
@media (min-width:768px){.aff-back img{width:14rem;height:14rem}}
.aff-caption{margin:1rem 0 0;font-size:.875rem;font-weight:300;line-height:1.5}
@media (min-width:640px){.aff-caption{font-size:1rem}}

.hall-page {
  min-height: 100dvh;
  padding: 8rem 1.5rem 4rem;
  max-width: 72rem;
  margin: 0 auto;
}
.hall-header {
  text-align: center;
  margin-bottom: 4rem;
}
.hall-title {
  font-size: 3rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  margin: 0 0 0.5rem;
  color: var(--fg);
}
.hall-divider {
  width: 40px;
  height: 1px;
  background: var(--muted);
  margin: 0 auto 1rem;
}
.hall-subtitle {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.fame-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
}
@media (min-width: 640px) {
  .fame-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1024px) {
  .fame-grid { grid-template-columns: repeat(3, 1fr); }
}
.fame-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #111;
  aspect-ratio: 16/11;
  border: 1px solid var(--border);
  transition: border-color 0.3s ease, transform 0.3s ease;
}
.fame-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
}
.fame-card-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.fame-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0) 100%);
  z-index: 1;
}
.fame-card-content {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 1.25rem;
}
.fame-card-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}
.fame-card-avatar {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.2);
  background: #222;
  flex: none;
}
.fame-card-avatar-wrap{
  position:relative;
  width:2.5rem;
  height:2.5rem;
  flex:none;
}
.fame-card-avatar-wrap .fame-card-avatar{width:100%;height:100%}
.fame-card-dot{
  position:absolute;right:-1px;bottom:-1px;
  width:.7rem;height:.7rem;border-radius:50%;
  background:var(--offline);border:2px solid #111;
}
.fame-card-dot[data-status="online"]{background:var(--online)}
.fame-card-dot[data-status="idle"]{background:var(--idle)}
.fame-card-dot[data-status="dnd"]{background:var(--dnd)}
.fame-card-status{
  font-size:10px;margin:.5rem 0 0;color:rgba(255,255,255,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fame-card-status[data-status="online"]{color:var(--online)}
.fame-card-status[data-status="idle"]{color:var(--idle)}
.fame-card-status[data-status="dnd"]{color:var(--dnd)}
.fame-card-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.fame-card-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: #fff;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fame-card-handle {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  margin: 0;
}
.fame-card-bio {
  font-size: 11px;
  color: rgba(255,255,255,0.85);
  margin: 0.25rem 0 0.85rem;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fame-card-tags {
  display: flex;
  gap: 0.4rem;
}
.fame-card-tag {
  width: 0.85rem;
  height: 0.85rem;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 2px;
}

.members-page{
  min-height:100dvh;
  padding:7rem 1rem 4rem;
  display:grid;
  grid-template-columns:1fr;
  gap:2rem;
  max-width:1400px;
  margin:0 auto;
}

  .members-page{
    grid-template-columns:280px 1fr 80px;
    align-items:center;gap:3rem;padding-top:5rem;
  }
}

.identity-panel{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:1.25rem;
  animation:fadeUp .8s cubic-bezier(.16,1,.3,1) both;
}

  .identity-panel{align-items:flex-start;text-align:left}
}
.avatar-wrapper{position:relative;width:6rem;height:6rem;flex:none}
.avatar-wrapper::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1px dashed var(--border);animation:spin 30s linear infinite;
}
.avatar-wrapper::after{
  content:"";position:absolute;inset:.35rem;border-radius:50%;
  border:1px solid var(--border);
}
.avatar{
  position:relative;z-index:1;
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;background:var(--panel);
  border:1px solid var(--border);

.avatar-deco{

  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
  z-index:2;
  display:none;
}
.avatar-deco.is-on{display:block}

.avatar-wrapper .presence-dot{
  position:absolute;z-index:3;

  border:3px solid var(--bg);background:var(--offline);
  transition:background-color .3s;
}
.avatar-wrapper .presence-dot[data-status="online"]{background:var(--online)}
.avatar-wrapper .presence-dot[data-status="idle"]{background:var(--idle)}

.member-role{

.carousel-container{
  position:relative;width:100%;height:500px;
  perspective:1200px;transform-style:preserve-3d;
  animation:fadeUp .8s .1s cubic-bezier(.16,1,.3,1) both;
}

.carousel{position:relative;width:100%;height:100%;transform-style:preserve-3d}

.carousel-card{
  position:absolute;top:50%;left:50%;
  width:90%;max-width:800px;
  aspect-ratio:16/9;margin:0;
  transform-origin:center center;
  border-radius:16px;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  overflow:hidden;
  transition:transform .7s cubic-bezier(.25,.46,.45,.94),
             opacity .7s cubic-bezier(.25,.46,.45,.94),
             box-shadow .7s ease;

    catch (e) { return 'https://cdn.discordapp.com/embed/avatars/0.png'; }
  }

  function safeUrl(u) {
    return (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : '';
  }

  function handleFromUrl(u) {
    try {
      var p = new URL(u).pathname.split('/').filter(Boolean);
      return p.length ? '@' + p[0] : '';
    } catch (e) { return ''; }
  }

  function memberLinks(m) {
    var sp = safeUrl(m.spotify), ig = safeUrl(m.instagram);
    return [
      { t: 'Spotify',   s: sp ? 'Listen on Spotify' : 'Not linked yet', u: sp, i: GM_ICONS.spotify },
      { t: 'Instagram', s: ig ? (handleFromUrl(ig) || 'View profile') : 'Not linked yet', u: ig, i: GM_ICONS.instagram },
      { t: 'Discord',   s: 'Open Discord profile', u: 'https://discord.com/users/' + encodeURIComponent(m.discordId), i: GM_ICONS.discord }
    ];
  }

  function buildLinks() {
    if (linksFor === index) return;
    linksFor = index;
    var L = memberLinks(MEMBERS[index]);

    // island rows: Spotify + Instagram are hidden on wide screens (they get side modals), shown on phones/tablets
    gmRows.innerHTML = L.map(function (l, i) {
      var dup = i < 2 ? ' dup' : '';
      var inner = '<i>' + l.i + '</i><span><b>' + escapeHTML(l.t) + '</b><small>' + escapeHTML(l.s) + '</small></span>';
      return l.u
        ? '<a class="gm-row' + dup + '" href="' + escapeHTML(l.u) + '" target="_blank" rel="noopener noreferrer">' + inner + '<em>&#8599;</em></a>'
        : '<div class="gm-row off' + dup + '" aria-disabled="true">' + inner + '</div>';
    }).join('');

    gmIsland.classList.add('xr');   // centre modal is always the taller variant now

    // side modals: always shown (left = Spotify, right = Instagram)
    [gmSideL, gmSideR].forEach(function (el, k) {
      var l = L[k];
      el.hidden = false;
      el.setAttribute('aria-label', l.t);
      var inner = '<i class="gm-sico">' + l.i + '</i><b class="gm-stt">' + escapeHTML(l.t) + '</b>' +
                  '<small class="gm-sub">' + escapeHTML(l.s) + '</small>';
      el.innerHTML = l.u
        ? '<a class="gm-in" href="' + escapeHTML(l.u) + '" target="_blank" rel="noopener noreferrer">' + inner + '<span class="gm-go">Open &#8599;</span></a>'
        : '<div class="gm-in off">' + inner + '<span class="gm-go">Coming soon</span></div>';
    });
  }

  function buildStage() {
    var h = '';
    MEMBERS.forEach(function (m, i) {
      h += '<div class="gm-card" role="option" aria-label="Member ' + (i + 1) + '">' +
        '<img src="' + escapeHTML(m.banner || defaultAvatar(m.discordId)) + '" alt="" draggable="false">' +
        '<span class="gm-tag">MEMBER / ' + pad(i + 1) + '</span></div>';
    });
    h += '<div class="gm-ring"></div>';
    gmStage.innerHTML = h;
    gmStage.querySelectorAll(':scope>.gm-card').forEach(function (c, i) {
      c.addEventListener('click', function () { go(i); });
    });

    gmTicks.style.setProperty('--n', total);
    MEMBERS.forEach(function (m, i) {
      var t = document.createElement('button');
      t.type = 'button';
      t.setAttribute('aria-label', 'Member ' + (i + 1));
      t.addEventListener('click', function () { go(i); });
      gmTicks.appendChild(t);
    });
  }

  function render() {
    gmStage.querySelectorAll(':scope>.gm-card').forEach(function (c, i) {
      var d = i - index, a = Math.abs(d);
      c.style.setProperty('--d', d);
      c.style.setProperty('--a', a);
      c.style.opacity = a > 1 ? 0 : a ? 0.4 : 1;
      c.style.filter = a ? 'brightness(.55) saturate(.8)' : 'none';
      c.style.pointerEvents = a > 1 ? 'none' : 'auto';
      c.classList.toggle('on', !a);
      c.setAttribute('aria-selected', a ? 'false' : 'true');
    });
    Array.prototype.forEach.call(gmTicks.children, function (t, i) { t.classList.toggle('on', i === index); });
    renderMember();
  }

  function go(i) {
    if (gm.classList.contains('modal')) return;
    index = Math.max(0, Math.min(total - 1, i));
    render();
  }
  function next() { go(index + 1); }
  function prev() { go(index - 1); }


  /* ---- palette: the page takes on the colour of the member on top ----
     Dominant hue is read from the banner. If the image host doesn't allow reading pixels,
     the Discord avatar is used instead, and as a last resort a hue derived from the member's ID. */
  var palState = {};

  function hsl(h, s, l) {
    return 'hsl(' + Math.round(((h % 360) + 360) % 360) + ' ' + Math.round(s * 100) + '% ' + Math.round(l * 100) + '%)';
  }

  function makePalette(h, s) {
    return [hsl(h, s * 0.7, 0.09), hsl(h, s * 0.75, 0.22), hsl(h, s * 0.65, 0.38), hsl(h + 8, s * 0.45, 0.68)];
  }

  function hashPalette(id) {
    var n = 0, str = String(id);
    for (var i = 0; i < str.length; i++) n = (n * 31 + str.charCodeAt(i)) % 360;
    return makePalette(n, 0.6);
  }

  function paletteFrom(im) {
    var N = 48, B = 24, c = document.createElement('canvas');
    c.width = c.height = N;
    var x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(im, 0, 0, N, N);
    var px = x.getImageData(0, 0, N, N).data;   // throws if the image taints the canvas
    var W = [], SX = [], SY = [], SS = [], i, k, energy = 0, seen = 0;
    for (k = 0; k < B; k++) { W[k] = 0; SX[k] = 0; SY[k] = 0; SS[k] = 0; }
    for (i = 0; i < px.length; i += 4) {
      if (px[i + 3] < 128) continue;
      var r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
      seen++;
      if (d < 0.02) continue;
      var h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h = ((h * 60) + 360) % 360;
      var sat = d / (1 - Math.abs(2 * l - 1) || 1);
      var w = d * d;
      k = Math.min(B - 1, Math.floor(h / 360 * B));
      var rad = h * Math.PI / 180;
      W[k] += w; SX[k] += w * Math.cos(rad); SY[k] += w * Math.sin(rad); SS[k] += w * sat;
      energy += w;
    }
    if (!seen || energy / seen < 0.004) return makePalette(220, 0.06);   // greyscale image: stay neutral
    var best = 0, bestW = -1;
    for (k = 0; k < B; k++) {
      var tw = W[k] + W[(k + 1) % B] + W[(k + B - 1) % B];
      if (tw > bestW) { bestW = tw; best = k; }
    }
    var ids = [(best + B - 1) % B, best, (best + 1) % B], ax = 0, ay = 0, as = 0, aw = 0;
    ids.forEach(function (j) { ax += SX[j]; ay += SY[j]; as += SS[j]; aw += W[j]; });
    var hue = (Math.atan2(ay, ax) * 180 / Math.PI + 360) % 360;
    var sat2 = Math.max(0.25, Math.min(0.85, aw ? as / aw : 0.5));
    return makePalette(hue, sat2);
  }

  function loadSample(url, cb) {
    var im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = function () { var p = null; try { p = paletteFrom(im); } catch (e) {} cb(p); };
    im.onerror = function () { cb(null); };
    im.src = url;
  }

  function setPalette(cols) {
    for (var i = 0; i < 4; i++) gm.style.setProperty('--c' + (i + 1), cols[i]);
  }

  function ensurePalette(i) {
    if (i < 0 || i >= total) return;
    var st = palState[i] || (palState[i] = { cols: null, src: '', busy: false, banner: false, avatar: false });
    if (st.cols && i === index) setPalette(st.cols);
    if (st.busy || st.src === 'banner') return;
    var m = MEMBERS[i], data = presenceCache[m.discordId], user = data && data.discord_user;
    var url = '', kind = '';
    if (m.banner && !st.banner) { url = m.banner; kind = 'banner'; }
    else if (!st.avatar && user && user.avatar) { url = getAvatarUrl(user.id, user.avatar); kind = 'avatar'; }
    if (!url) {
      if (!st.cols) { st.cols = hashPalette(m.discordId); st.src = 'hash'; if (i === index) setPalette(st.cols); }
      return;
    }
    st[kind] = true;
    st.busy = true;
    loadSample(url, function (cols) {
      st.busy = false;
      if (cols && st.src !== 'banner') { st.cols = cols; st.src = kind; if (i === index) setPalette(cols); }
      ensurePalette(i);   // this source failed or was upgraded: try the next one
    });
  }

  // fills the profile, island and side modals for the member on top from the latest presence
  function renderMember() {
    var m = MEMBERS[index];
    if (!m) return;
    var data = presenceCache[m.discordId];
    var user = data && data.discord_user;
    var status = data ? data.discord_status : 'offline';

    var avatar = (user && user.avatar) ? getAvatarUrl(user.id, user.avatar) : defaultAvatar(m.discordId);
    gm.querySelectorAll('.gm-av').forEach(function (img) {
      if (img.getAttribute('src') !== avatar) img.src = avatar;
    });

    var name = displayName(m, data);
    var handle = handleText(m, data) || ('id ' + m.discordId);
    document.getElementById('gmName').textContent = name;
    document.getElementById('gmMName').textContent = name;
    document.getElementById('gmHandle').textContent = handle;
    document.getElementById('gmMUn').textContent = handle;
    document.getElementById('gmRole').textContent = roleText(m, data);

    gm.querySelectorAll('[data-s]').forEach(function (e) { e.setAttribute('data-s', status); });
    document.getElementById('gmPfpDot').title = statusLabel(status);
    document.getElementById('gmSLabel').textContent = statusLabel(status);

    applyDeco(document.getElementById('gmDeco'), user);

    document.getElementById('gmCs').textContent = bioText(m, data);
    // activityLabel() would read a custom status as an activity ("Doing"), so leave those out here
    var act = data ? activityLabel({
      listening_to_spotify: data.listening_to_spotify,
      spotify: data.spotify,
      activities: (data.activities || []).filter(function (a) { return a && a.type !== 4; })
    }) : null;
    document.getElementById('gmAct').textContent = act ? (act.type === 'spotify' ? 'Spotify \u00b7 ' : '') + act.text : '';

    // members without a banner fall back to their Discord banner / avatar
    gmStage.querySelectorAll(':scope>.gm-card').forEach(function (c, i) {
      var mm = MEMBERS[i];
      if (mm.banner) return;
      var d = presenceCache[mm.discordId], u = d && d.discord_user;
      var src = u ? (getBannerUrl(u.id, u.banner) || getAvatarUrl(u.id, u.avatar)) : defaultAvatar(mm.discordId);
      var im = c.querySelector('img');
      if (im && im.getAttribute('src') !== src) im.src = src;
    });

    buildLinks();
    ensurePalette(index);
    // warm up the neighbours so the colour change is ready by the time you get there
    clearTimeout(palWarm);
    palWarm = setTimeout(function () { ensurePalette(index + 1); ensurePalette(index - 1); }, 500);
  }

  /* ---- island + ring spin ---- */
  var rot = 0, raf = 0, t0 = 0, spinT = 0;
  function tick(t) {
    rot = (rot - Math.min(t - t0, 250) * 0.012) % 360;
    t0 = t;
    gmStage.style.setProperty('--rot', rot + 'deg');
    raf = requestAnimationFrame(tick);
  }
  function startSpin() { gm.classList.add('spin'); t0 = performance.now(); raf = requestAnimationFrame(tick); }
  function stopSpin() { clearTimeout(spinT); cancelAnimationFrame(raf); gm.classList.remove('spin'); }

  // lays the cards out on a 9-slot ring centred on the member on top; gaps are filled with copies
  function layoutRing() {
    var n = total, cards = gmStage.querySelectorAll(':scope>.gm-card'), ring = gmStage.querySelector('.gm-ring'), seen = {};
    cards.forEach(function (c, i) {
      var w = ((i - index) % n + n) % n;
      if (w > n / 2) w -= n;
      c.style.setProperty('--m', w);
      c.classList.toggle('far', Math.abs(w) > 4);
      if (Math.abs(w) <= 4) seen[w] = true;
    });
    ring.innerHTML = '';
    for (var k = -4; k <= 4; k++) {
      if (seen[k]) continue;
      var j = ((index + k) % n + n) % n, g = document.createElement('div');
      g.className = 'gm-card ghost';
      g.setAttribute('aria-hidden', 'true');
      g.style.setProperty('--m', k);
      g.innerHTML = '<img src="' + escapeHTML(cards[j].querySelector('img').getAttribute('src')) + '" alt="" draggable="false">' +
        '<span class="gm-tag">MEMBER / ' + pad(j + 1) + '</span>';
      ring.appendChild(g);
    }
  }

  function toggle(open) {
    stopSpin();
    if (open) {
      layoutRing();
      rot = 0;
      gmStage.style.setProperty('--rot', '0deg');
      if (!mobileMQ.matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) spinT = setTimeout(startSpin, 950);
    }
    gm.classList.toggle('modal', open);
    gmIslands.forEach(function (e) { e.classList.toggle('open', open); e.inert = !open; });
    (open ? gmClose : gmPfp).focus({ preventScroll: true });
  }
  gmPfp.addEventListener('click', function () { toggle(true); });
  gmClose.addEventListener('click', function () { toggle(false); });
  gmScrim.addEventListener('click', function () { toggle(false); });
  window.addEventListener('hashchange', function () { if (gm.classList.contains('modal')) toggle(false); });

  /* ---- navigation: keys, wheel, swipe ---- */
  function membersActive() { return views['/members'].classList.contains('active'); }

  document.addEventListener('keydown', function (e) {
    if (!membersActive()) return;
    if (e.key === 'Escape' && gm.classList.contains('modal')) { toggle(false); return; }
    if (gm.classList.contains('modal')) return;
    if (e.target.matches && e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); next(); }
  });

  var scrollAccum = 0, scrollIdleTimer = null, SCROLL_THRESHOLD = 80;
  window.addEventListener('wheel', function (e) {
    if (!membersActive() || e.ctrlKey) return;
    if (gm.classList.contains('modal')) return;   // let the island scroll on its own
    e.preventDefault();
    scrollAccum += e.deltaY;
    if (Math.abs(scrollAccum) >= SCROLL_THRESHOLD) {
      if (scrollAccum > 0) next(); else prev();
      scrollAccum = 0;
    }
    if (scrollIdleTimer) clearTimeout(scrollIdleTimer);
    scrollIdleTimer = setTimeout(function () { scrollAccum = 0; }, 200);
  }, { passive: false });

  var touchX = 0, touchY = 0;
  gm.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  gm.addEventListener('touchend', function (e) {
    if (gm.classList.contains('modal')) return;
    var t = e.changedTouches[0], dx = touchX - t.clientX, dy = touchY - t.clientY;
    var mo = mobileMQ.matches ? [dx, dy] : [dy, dx];
    if (Math.abs(mo[0]) > 40 && Math.abs(mo[0]) > Math.abs(mo[1])) go(index + (mo[0] > 0 ? 1 : -1));
  });

  var LANYARD_REST_BASE = 'https://api.lanyard.rest/v1/users/';
  var LANYARD_SOCKET_URL = 'wss://api.lanyard.rest/socket';

  var presenceCache = {};
  var socket = null;
  var heartbeatTimer = null;
  var reconnectTimer = null;
  var gotInit = false;

  function isPlaceholder(id) {
    return !id || id.indexOf('REPLACE_WITH') === 0;
  }

  function getAvatarUrl(userId, hash) {
    if (!hash) return 'https://cdn.discordapp.com/embed/avatars/0.png';
    var ext = hash.startsWith('a_') ? 'gif' : 'png';
    return 'https://cdn.discordapp.com/avatars/' + userId + '/' + hash + '.' + ext + '?size=512';
  }

  function getBannerUrl(userId, hash) {
    if (!hash) return null;
    var ext = hash.startsWith('a_') ? 'gif' : 'png';
    return 'https://cdn.discordapp.com/banners/' + userId + '/' + hash + '.' + ext + '?size=600';
  }

  function statusLabel(s) {
    if (s === 'online') return 'Online';
    if (s === 'idle') return 'Idle';
    if (s === 'dnd') return 'Do Not Disturb';
    return 'Offline';
  }

  function activityLabel(data) {
    if (!data) return null;

    if (data.listening_to_spotify && data.spotify) {
      return {
        type: 'spotify',
        text: data.spotify.song + ' — ' + data.spotify.artist,
        icon: data.spotify.album_art_url
      };
    }

    var acts = data.activities;
    if (!acts || !acts.length) return null;

    var a = acts[0];
    var prefix = a.type === 0 ? 'Playing'
               : a.type === 1 ? 'Streaming'
               : a.type === 2 ? 'Listening'
               : a.type === 3 ? 'Watching'
               : a.type === 5 ? 'Competing'
               : 'Doing';
    return {
      type: 'activity',
      text: prefix + ' ' + (a.name || ''),
      icon: null
    };
  }

  function memberFromId(userId) {
    for (var i = 0; i < MEMBERS.length; i++) {
      if (MEMBERS[i].discordId === userId) return MEMBERS[i];
    }
    for (var k = 0; k < HALL_OF_FAME.length; k++) {
      if (HALL_OF_FAME[k].discordId === userId) return HALL_OF_FAME[k];
    }
    return null;
  }

  function hallFromId(userId) {
    for (var i = 0; i < HALL_OF_FAME.length; i++) {
      if (HALL_OF_FAME[i].discordId === userId) return HALL_OF_FAME[i];
    }
    return null;
  }

  // every Discord ID the page needs presence for (members + hall of fame, de-duplicated)
  function allIds() {
    var seen = {}, out = [];
    MEMBERS.concat(HALL_OF_FAME).forEach(function (m) {
      if (!isPlaceholder(m.discordId) && !seen[m.discordId]) {
        seen[m.discordId] = true;
        out.push(m.discordId);
      }
    });
    return out;
  }

  function fetchPresenceREST(id) {
    if (isPlaceholder(id)) return Promise.resolve(null);

    return fetch(LANYARD_REST_BASE + id)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.success && j.data) {
          presenceCache[id] = j.data;
          return j.data;
        }
        return null;
      })
      .catch(function () { return null; });
  }

  function fetchAllREST() {
    return Promise.all(allIds().map(function (id) { return fetchPresenceREST(id); }))
      .then(function () { renderPresence(); });
  }

  function connectSocket() {
    if (socket) return;

    var ids = allIds();
    if (!ids.length) return;

    gotInit = false;
    socket = new WebSocket(LANYARD_SOCKET_URL);

    var initTimeout = setTimeout(function () {
      if (!gotInit) fetchAllREST();
    }, 5000);

    socket.onopen = function () {
      socket.send(JSON.stringify({ op: 2, d: { subscribe_to_ids: ids } }));
    };

    socket.onmessage = function (event) {
      var msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }

      if (msg.op === 1 && msg.d && msg.d.heartbeat_interval) {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(function () {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ op: 3 }));
          }
        }, msg.d.heartbeat_interval);
      }

      if (msg.op === 0 && msg.t === 'INIT_STATE') {
        gotInit = true;
        clearTimeout(initTimeout);
        var map = msg.d || {};
        Object.keys(map).forEach(function (userId) {
          var member = memberFromId(userId);
          if (member) presenceCache[member.discordId] = map[userId];
        });
        renderPresence();
      }

      if (msg.op === 0 && msg.t === 'PRESENCE_UPDATE') {
        var userId = msg.d && msg.d.user_id;
        if (!userId) return;
        var member = memberFromId(userId);
        if (member) {
          presenceCache[member.discordId] = msg.d;
          renderPresence();
        }
      }
    };

    socket.onclose = function () {
      socket = null;
      clearTimeout(initTimeout);
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      fetchAllREST();
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          connectSocket();
        }, 10000);
      }
    };

    socket.onerror = function () {
      if (socket) socket.close();
    };
  }

  function renderPresence() {
    document.querySelectorAll('.fame-card').forEach(function (card) {
      var id = card.getAttribute('data-id');
      var member = hallFromId(id);
      var data = presenceCache[id];
      var user = data && data.discord_user;
      var fStatus = data ? data.discord_status : 'offline';

      var img = card.querySelector('.fame-card-avatar');
      if (img && user) img.src = getAvatarUrl(user.id, user.avatar);

      var bgImg = card.querySelector('.fame-card-bg');
      if (bgImg && user) {
        var bgUrl = (member && member.banner) || getBannerUrl(user.id, user.banner) || getAvatarUrl(user.id, user.avatar);
        if (bgImg.getAttribute('src') !== bgUrl) bgImg.src = bgUrl;
      }

      applyDeco(card.querySelector('.avatar-deco'), user);

      var nameEl = card.querySelector('.fame-card-name');
      if (nameEl && member) nameEl.textContent = displayName(member, data);

      var handleEl = card.querySelector('.fame-card-handle');
      if (handleEl && member) handleEl.textContent = handleText(member, data);

      var fDot = card.querySelector('.fame-card-dot');
      if (fDot) { fDot.setAttribute('data-status', fStatus); fDot.title = statusLabel(fStatus); }

      var fStatusEl = card.querySelector('.fame-card-status');
      if (fStatusEl) {
        var fAct = data ? activityLabel(data) : null;
        fStatusEl.textContent = statusLabel(fStatus) + (fAct ? ' \u00b7 ' + fAct.text : '');
        fStatusEl.setAttribute('data-status', fStatus);
      }

      var bioEl = card.querySelector('.fame-card-bio');
      if (bioEl && member) bioEl.textContent = bioText(member, data);
    });

    renderMember();
  }

  buildHallOfFame();
  buildStage();
  render();
  applyRoute();
})();
</script>

document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('.aff-card,.grid-card,.fame-card');if(!t)return;var r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});

<style>
.bgban{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:0;transform:scale(1.07);pointer-events:none;transition:opacity .75s ease,transform 1.4s cubic-bezier(.16,1,.3,1)}
.bgban::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,6,6,.3),rgba(5,6,6,.72))}
.bgban.on{opacity:.8;transform:scale(1)}
html.banner-bg .intro-overlay.is-bg canvas{opacity:.1!important}
@media (prefers-reduced-motion:reduce){.bgban{transition:opacity .2s;transform:none}}
</style>
<script>
/* hovering a member banner turns it into the page background; leaving fades back to the ASCII */
(function () {
  var L = [document.createElement('div'), document.createElement('div')], k = 0, cur = null, root = document.documentElement;
  L.forEach(function (d) { d.className = 'bgban'; d.setAttribute('aria-hidden', 'true'); document.body.appendChild(d); });
  function reset() { cur = null; L.forEach(function (d) { d.classList.remove('on'); }); root.classList.remove('banner-bg'); }
  function src(c) { var im = c.querySelector('.fame-card-bg') || c.querySelector('img'); return im && (im.currentSrc || im.src); }
  document.addEventListener('pointerover', function (e) {
    if (e.pointerType === 'touch') return;
    var c = e.target.closest && e.target.closest('.carousel-card,.fame-card');
    if (c === cur) return;
    if (!c) { reset(); return; }
    var u = src(c); if (!u) return;
    cur = c; k ^= 1;
    L[k].style.backgroundImage = 'url("' + u.replace(/"/g, '%22') + '")';
    L[k].classList.add('on'); L[k ^ 1].classList.remove('on'); root.classList.add('banner-bg');
  }, { passive: true });
  root.addEventListener('mouseleave', reset);
})();
</script>
