  var total = MEMBERS.length;

  function buildCarousel() {
    carousel.innerHTML = MEMBERS.map(function (m, i) {
      var initialImg = m.banner ? m.banner : 'https://cdn.discordapp.com/embed/avatars/0.png';
      return '<div class="carousel-card" data-index="' + i + '" role="option" aria-selected="' + (i === index) + '">' +
        '<div class="card-overlay"></div>' +
        '<span class="card-label">MEMBER / #' + pad(i + 1) + '</span>' +
        '<div class="card-presence" data-status="offline"><span class="dot"></span><span class="presence-label">Offline</span></div>' +
        '<img src="' + initialImg + '" alt="">' +
      '</div>';
    }).join('');
  }

  function updatePositions() {
    var cards = carousel.querySelectorAll('.carousel-card');
    cards.forEach(function (card, i) {
      var diff = i - index;
      var pos;
      if (diff === 0) pos = '0';
      else if (diff === 1) pos = '1';
      else if (diff === -1) pos = '-1';
      else if (diff === 2) pos = '2';
      else if (diff === -2) pos = '-2';
      else pos = 'hidden';

      if (pos === 'hidden') {
        card.setAttribute('data-pos', 'hidden');
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
        card.style.transform = 'translate(-50%,-50%) rotateY(-12deg) rotateX(4deg) translateZ(-500px)';
        card.style.zIndex = '0';
        return;
      }
      card.style.opacity = '';
      card.style.transform = '';
      card.style.zIndex = '';
      card.setAttribute('data-pos', pos);
      card.style.pointerEvents = (pos === '0') ? 'auto' : 'none';
      card.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });

    var m = MEMBERS[index];
    idName.textContent = displayName(m, presenceCache[m.discordId]);
    idHandle.textContent = handleText(m, presenceCache[m.discordId]);
    idRole.textContent = roleText(m, presenceCache[m.discordId]);

    renderPresence();

    var steps = rail.querySelectorAll('.rail-step');
    steps.forEach(function (s, i) {
      var on = i === index;
      s.classList.toggle('is-active', on);
      s.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) {
        var rTop = rail.scrollTop;
        var rBottom = rTop + rail.clientHeight;
        var sTop = s.offsetTop;
        var sBottom = sTop + s.offsetHeight;
        if (sTop < rTop) rail.scrollTop = sTop - 8;
        else if (sBottom > rBottom) rail.scrollTop = sBottom - rail.clientHeight + 8;
      }
    });
  }

  function buildRail() {
    rail.innerHTML = MEMBERS.map(function (m, i) {
      return '<button class="rail-step' + (i === index ? ' is-active' : '') + '" type="button" role="tab" aria-label="Go to member ' + (i + 1) + '" aria-selected="' + (i === index) + '"><span>' + pad(i + 1) + '</span></button>';
    }).join('');
    rail.querySelectorAll('.rail-step').forEach(function (btn, i) {
      btn.addEventListener('click', function () { goTo(i); });
    });
  }

  function buildGrid() {
    gridView.innerHTML = MEMBERS.map(function (m) {
      return '<article class="grid-card" data-id="' + escapeHTML(m.discordId) + '">' +
        '<div class="grid-presence" data-status="offline"><span class="dot"></span><span class="grid-presence-label">Offline</span></div>' +
        '<div class="avatar-wrapper">' +
          '<img class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">' +
          '<img class="avatar-deco" alt="" aria-hidden="true">' +
        '</div>' +
        '<h3 class="member-name">' + escapeHTML(displayName(m, null)) + '</h3>' +
        '<p class="member-role">' + escapeHTML(m.role || '') + '</p>' +
        '<p class="member-bio">' + escapeHTML(m.bio || '') + '</p>' +
      '</article>';
    }).join('');
  }

  function goTo(i) { index = (i + total) % total; updatePositions(); }
  function next() { goTo(index + 1); }
  function prev() { goTo(index - 1); }

  document.addEventListener('keydown', function (e) {
    if (!views['/members'].classList.contains('active')) return;
    if (showcase.classList.contains('grid-mode')) return;
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  });

  var startX = null, startY = null;
  showcase.addEventListener('touchstart', function (e) {
    if (showcase.classList.contains('grid-mode')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  showcase.addEventListener('touchend', function (e) {
    if (startX === null || showcase.classList.contains('grid-mode')) return;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) goTo(index + (dx < 0 ? 1 : -1));
    else if (Math.abs(dy) > 45 && Math.abs(dy) > Math.abs(dx)) goTo(index + (dy < 0 ? 1 : -1));
    startX = null; startY = null;
  }, { passive: true });

  // --- SCROLL-TO-NAVIGATE FOR THE WHOLE MEMBERS PAGE ---
  // Scroll anywhere on the page to advance members. One scroll gesture = one member.
  var scrollAccum = 0;
  var scrollIdleTimer = null;
  var SCROLL_THRESHOLD = 80;

  function resetScrollAccumSoon() {
    if (scrollIdleTimer) clearTimeout(scrollIdleTimer);
    scrollIdleTimer = setTimeout(function () {
      scrollAccum = 0;
    }, 200);
  }

  window.addEventListener('wheel', function (e) {
    if (!views['/members'].classList.contains('active')) return;
    if (showcase.classList.contains('grid-mode')) return;

    e.preventDefault();
    scrollAccum += e.deltaY;

    if (Math.abs(scrollAccum) >= SCROLL_THRESHOLD) {
      if (scrollAccum > 0) next();
      else prev();
      scrollAccum = 0;
    }
    resetScrollAccumSoon();
  }, { passive: false });

  function setView(mode) {
    var isGrid = mode === 'grid';
    showcase.classList.toggle('grid-mode', isGrid);
    viewGrid.classList.toggle('is-active', isGrid);
    viewSingle.classList.toggle('is-active', !isGrid);
    viewGrid.setAttribute('aria-pressed', isGrid ? 'true' : 'false');
    viewSingle.setAttribute('aria-pressed', isGrid ? 'false' : 'true');
    try { localStorage.setItem('membersView', mode); } catch (e) {}
    renderPresence();
  }
  viewGrid.addEventListener('click', function () { setView('grid'); });
  viewSingle.addEventListener('click', function () { setView('single'); });

  var LANYARD_REST_BASE = 'https://api.lanyard.rest/v1/users/';
  var LANYARD_SOCKET_URL = 'wss://api.lanyard.rest/socket';

  var presenceCache = {};
  var socket = null;
  var heartbeatTimer = null;
  var reconnectTimer = null;
  var gotInit = false;

  function isPlaceholder(id) {
    return !id || id.indexOf('REPLACE_WITH') === 0;
  }

  function getAvatarUrl(userId, hash) {
    if (!hash) return 'https://cdn.discordapp.com/embed/avatars/0.png';
    var ext = hash.startsWith('a_') ? 'gif' : 'png';
    return 'https://cdn.discordapp.com/avatars/' + userId + '/' + hash + '.' + ext + '?size=512';
  }

  function getBannerUrl(userId, hash) {
    if (!hash) return null;
    var ext = hash.startsWith('a_') ? 'gif' : 'png';
    return 'https://cdn.discordapp.com/banners/' + userId + '/' + hash + '.' + ext + '?size=600';
  }

  function statusLabel(s) {
    if (s === 'online') return 'Online';
    if (s === 'idle') return 'Idle';
    if (s === 'dnd') return 'Do Not Disturb';
    return 'Offline';
  }

  function activityLabel(data) {
    if (!data) return null;

    if (data.listening_to_spotify && data.spotify) {
      return {
        type: 'spotify',
        text: data.spotify.song + ' — ' + data.spotify.artist,
        icon: data.spotify.album_art_url
      };
    }

    var acts = data.activities;
    if (!acts || !acts.length) return null;

    var a = acts[0];
    var prefix = a.type === 0 ? 'Playing'
               : a.type === 1 ? 'Streaming'
               : a.type === 2 ? 'Listening'
               : a.type === 3 ? 'Watching'
               : a.type === 5 ? 'Competing'
               : 'Doing';
    return {
      type: 'activity',
      text: prefix + ' ' + (a.name || ''),
      icon: null
    };
  }

  function memberFromId(userId) {
    for (var i = 0; i < MEMBERS.length; i++) {
      if (MEMBERS[i].discordId === userId) return MEMBERS[i];
    }
    for (var k = 0; k < HALL_OF_FAME.length; k++) {
      if (HALL_OF_FAME[k].discordId === userId) return HALL_OF_FAME[k];
    }
    return null;
  }

  function hallFromId(userId) {
    for (var i = 0; i < HALL_OF_FAME.length; i++) {
      if (HALL_OF_FAME[i].discordId === userId) return HALL_OF_FAME[i];
    }
    return null;
  }

  // every Discord ID the page needs presence for (members + hall of fame, de-duplicated)
  function allIds() {
    var seen = {}, out = [];
    MEMBERS.concat(HALL_OF_FAME).forEach(function (m) {
      if (!isPlaceholder(m.discordId) && !seen[m.discordId]) {
        seen[m.discordId] = true;
        out.push(m.discordId);
      }
    });
    return out;
  }

  function fetchPresenceREST(id) {
    if (isPlaceholder(id)) return Promise.resolve(null);

    return fetch(LANYARD_REST_BASE + id)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.success && j.data) {
          presenceCache[id] = j.data;
          return j.data;
        }
        return null;
      })
      .catch(function () { return null; });
  }

  function fetchAllREST() {
    return Promise.all(allIds().map(function (id) { return fetchPresenceREST(id); }))
      .then(function () { renderPresence(); });
  }

  function connectSocket() {
    if (socket) return;

    var ids = allIds();
    if (!ids.length) return;

    gotInit = false;
    socket = new WebSocket(LANYARD_SOCKET_URL);

    var initTimeout = setTimeout(function () {
      if (!gotInit) fetchAllREST();
    }, 5000);

    socket.onopen = function () {
      socket.send(JSON.stringify({ op: 2, d: { subscribe_to_ids: ids } }));
    };

    socket.onmessage = function (event) {
      var msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }

      if (msg.op === 1 && msg.d && msg.d.heartbeat_interval) {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(function () {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ op: 3 }));
          }
        }, msg.d.heartbeat_interval);
      }

      if (msg.op === 0 && msg.t === 'INIT_STATE') {
        gotInit = true;
        clearTimeout(initTimeout);
        var map = msg.d || {};
        Object.keys(map).forEach(function (userId) {
          var member = memberFromId(userId);
          if (member) presenceCache[member.discordId] = map[userId];
        });
        renderPresence();
      }

      if (msg.op === 0 && msg.t === 'PRESENCE_UPDATE') {
        var userId = msg.d && msg.d.user_id;
        if (!userId) return;
        var member = memberFromId(userId);
        if (member) {
          presenceCache[member.discordId] = msg.d;
          renderPresence();
        }
      }
    };

    socket.onclose = function () {
      socket = null;
      clearTimeout(initTimeout);
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      fetchAllREST();
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          connectSocket();
        }, 10000);
      }
    };

    socket.onerror = function () {
      if (socket) socket.close();
    };
  }

  function renderPresence() {
    document.querySelectorAll('.fame-card').forEach(function (card) {
      var id = card.getAttribute('data-id');
      var member = hallFromId(id);
      var data = presenceCache[id];
      var user = data && data.discord_user;
      var fStatus = data ? data.discord_status : 'offline';

      var img = card.querySelector('.fame-card-avatar');
      if (img && user) img.src = getAvatarUrl(user.id, user.avatar);

      var bgImg = card.querySelector('.fame-card-bg');
      if (bgImg && user) {
        var bgUrl = (member && member.banner) || getBannerUrl(user.id, user.banner) || getAvatarUrl(user.id, user.avatar);
        if (bgImg.getAttribute('src') !== bgUrl) bgImg.src = bgUrl;
      }

      applyDeco(card.querySelector('.avatar-deco'), user);

      var nameEl = card.querySelector('.fame-card-name');
      if (nameEl && member) nameEl.textContent = displayName(member, data);

      var handleEl = card.querySelector('.fame-card-handle');
      if (handleEl && member) handleEl.textContent = handleText(member, data);

      var fDot = card.querySelector('.fame-card-dot');
      if (fDot) { fDot.setAttribute('data-status', fStatus); fDot.title = statusLabel(fStatus); }

      var fStatusEl = card.querySelector('.fame-card-status');
      if (fStatusEl) {
        var fAct = data ? activityLabel(data) : null;
        fStatusEl.textContent = statusLabel(fStatus) + (fAct ? ' \u00b7 ' + fAct.text : '');
        fStatusEl.setAttribute('data-status', fStatus);
      }

      var bioEl = card.querySelector('.fame-card-bio');
      if (bioEl && member) bioEl.textContent = bioText(member, data);
    });

    var m = MEMBERS[index];
    if (!m) return;
    var data = presenceCache[m.discordId];
    var status = data ? data.discord_status : 'offline';
    var user = data && data.discord_user;

    var dot = document.getElementById('identityDot');
    if (dot) { dot.setAttribute('data-status', status); dot.title = statusLabel(status); }

    if (user) {
      idAvatar.src = getAvatarUrl(user.id, user.avatar);
    } else {
      idAvatar.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
    }

    applyDeco(idDeco, user);

    idName.textContent = displayName(m, data);
    idHandle.textContent = handleText(m, data);
    idRole.textContent = roleText(m, data);

    if (idBio) idBio.textContent = bioText(m, data);

    var chip = document.getElementById('identityActivity');
    var chipIcon = document.getElementById('identityActivityIcon');
    var chipText = document.getElementById('identityActivityText');
    var act = data ? activityLabel(data) : null;

    if (act) {
      chip.classList.remove('hidden');
      chip.classList.toggle('spotify', act.type === 'spotify');
      chipText.innerHTML = '<span class="chip-label">' +
        (act.type === 'spotify' ? 'Spotify' : 'Activity') +
        '</span> · ' + escapeHTML(act.text);
      if (act.icon) { chipIcon.src = act.icon; chipIcon.style.display = ''; }
      else { chipIcon.style.display = 'none'; }
    } else {
      chip.classList.add('hidden');
    }

    var card = carousel.querySelector('.carousel-card[data-pos="0"]');
    if (card) {
      var img = card.querySelector('img');
      if (img) {
        if (m.banner) {
          img.src = m.banner;
        } else if (user) {
          var bannerUrl = getBannerUrl(user.id, user.banner);
          if (bannerUrl) {
             img.src = bannerUrl;
          } else {
             img.src = getAvatarUrl(user.id, user.avatar);
          }
        } else {
          img.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
      }

      var badge = card.querySelector('.card-presence');
      if (badge) {
        badge.setAttribute('data-status', status);
        var lbl = badge.querySelector('.presence-label');
        if (lbl) lbl.textContent = statusLabel(status);
      }
    }

    gridView.querySelectorAll('.grid-card').forEach(function (gc) {
      var gId = gc.getAttribute('data-id');
      var gData = presenceCache[gId];
      var gStatus = gData ? gData.discord_status : 'offline';
      var gUser = gData && gData.discord_user;

      var gImg = gc.querySelector('.avatar');
      if (gImg) {
        if (gUser) {
          gImg.src = getAvatarUrl(gUser.id, gUser.avatar);
        } else {
          gImg.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
      }

      applyDeco(gc.querySelector('.avatar-deco'), gUser);

      var gNameEl = gc.querySelector('.member-name');
      var gMember = memberFromId(gId);
      if (gNameEl && gMember) gNameEl.textContent = displayName(gMember, gData);

      var gRoleEl = gc.querySelector('.member-role');
      if (gRoleEl && gMember) gRoleEl.textContent = roleText(gMember, gData);

      var gBioEl = gc.querySelector('.member-bio');
      if (gBioEl && gMember) gBioEl.textContent = bioText(gMember, gData);

      var gp = gc.querySelector('.grid-presence');
      if (gp) {
        gp.setAttribute('data-status', gStatus);
        var gl = gp.querySelector('.grid-presence-label');
        if (gl) gl.textContent = statusLabel(gStatus);
      }
    });
  }

  buildHallOfFame();
  buildCarousel();
  buildRail();
  buildGrid();

  var savedView = null;
  try { savedView = localStorage.getItem('membersView'); } catch (e) {}
  if (savedView === 'grid') setView('grid');

  updatePositions();
  applyRoute();
})();
</script>
<script>
document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('.aff-card,.grid-card,.fame-card');if(!t)return;var r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});
</script>
<style>
.bgban{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:0;transform:scale(1.07);pointer-events:none;transition:opacity .75s ease,transform 1.4s cubic-bezier(.16,1,.3,1)}
.bgban::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,6,6,.3),rgba(5,6,6,.72))}
.bgban.on{opacity:.8;transform:scale(1)}
html.banner-bg .intro-overlay.is-bg canvas{opacity:.1!important}
@media (prefers-reduced-motion:reduce){.bgban{transition:opacity .2s;transform:none}}
</style>
<script>
/* hovering a member banner turns it into the page background; leaving fades back to the ASCII */
(function () {
  var L = [document.createElement('div'), document.createElement('div')], k = 0, cur = null, root = document.documentElement;
  L.forEach(function (d) { d.className = 'bgban'; d.setAttribute('aria-hidden', 'true'); document.body.appendChild(d); });
  function reset() { cur = null; L.forEach(function (d) { d.classList.remove('on'); }); root.classList.remove('banner-bg'); }
  function src(c) { var im = c.querySelector('.fame-card-bg') || c.querySelector('img'); return im && (im.currentSrc || im.src); }
  document.addEventListener('pointerover', function (e) {
    if (e.pointerType === 'touch') return;
    var c = e.target.closest && e.target.closest('.carousel-card,.fame-card');
    if (c === cur) return;
    if (!c) { reset(); return; }
    var u = src(c); if (!u) return;
    cur = c; k ^= 1;
    L[k].style.backgroundImage = 'url("' + u.replace(/"/g, '%22') + '")';
    L[k].classList.add('on'); L[k ^ 1].classList.remove('on'); root.classList.add('banner-bg');
  }, { passive: true });
  root.addEventListener('mouseleave', reset);
})();
</script>
