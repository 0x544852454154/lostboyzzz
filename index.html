<style>
:root{
  --bg:#050505;--fg:#fafafa;--muted:rgba(255,255,255,.4);
  --border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.16);
  --panel:rgba(255,255,255,.04);--panel-hover:rgba(255,255,255,.06);
  --soft:rgba(255,255,255,.04);--hover:rgba(255,255,255,.06);
  --active:rgba(255,255,255,.08);
  --nav-bg:rgba(0,0,0,.8);
  --card-bg:#111;--card-border:rgba(255,255,255,.10);
  --card-bg-soft:rgba(255,255,255,.06);
  --thumb-bg:rgba(0,0,0,.25);--inner:rgba(255,255,255,.02);
  --skeleton:rgba(255,255,255,.06);
  --bracket:rgba(255,255,255,.3);--plus:rgba(255,255,255,.7);
  --online:#23a55a;--idle:#f0b232;--dnd:#f23f43;--offline:#80848e;
  --spotify:#1db954;
}
html.light{
  --bg:#fff;--fg:#0a0a0a;--muted:rgba(0,0,0,.45);
  --border:rgba(0,0,0,.10);--border-hover:rgba(0,0,0,.18);
  --panel:rgba(0,0,0,.02);--panel-hover:rgba(0,0,0,.04);
  --soft:rgba(0,0,0,.03);--hover:rgba(0,0,0,.05);
  --active:rgba(0,0,0,.07);
  --nav-bg:rgba(255,255,255,.85);
  --card-bg:#fff;--card-border:rgba(0,0,0,.10);
  --card-bg-soft:rgba(0,0,0,.03);
  --thumb-bg:rgba(0,0,0,.04);--inner:rgba(0,0,0,.015);
  --skeleton:rgba(0,0,0,.06);
  --bracket:rgba(0,0,0,.3);--plus:rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background-color:var(--bg);color:var(--fg);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-weight:300;min-height:100%;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .3s ease,color .3s ease;
  overflow-x:hidden;
  

  background-image: 
    linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.8) 40%, var(--bg) 100%),
    url('https://file.garden/am9m147l3hw3nqT1/Lostboys%20Graffiti%20Tag%20Logo.png');
  background-size: cover;
  background-position: center top;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

html.light body {
  background-image: none;
}

body.intro-active { overflow: hidden; }

img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-9999px;top:0;z-index:200;padding:.5rem 1rem;border-radius:.5rem;background:var(--fg);color:var(--bg);font-size:.875rem;text-decoration:none}
.skip-link:focus{left:1rem;top:1rem;outline:2px solid var(--fg);outline-offset:2px}
:where(a,button,[tabindex]):focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.intro-overlay,
.intro-overlay *,
.intro-overlay *::before,
.intro-overlay *::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

.intro-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:#000;
  opacity:1;
  pointer-events:auto;
  cursor:pointer;
  outline:none;
  transition:opacity .38s cubic-bezier(.16,1,.3,1);
}
.intro-overlay.intro-fade-out{opacity:0;pointer-events:none}
.intro-overlay[hidden]{display:none}

.intro-content{
  position:relative;
  display:grid;
  place-items:center;
  width:100vw;
  height:100vh;
}
.intro-overlay video{
  grid-area:1 / 1;
  width:85vw;
  max-width:580px;
  max-height:75vh;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}
.intro-skip-hint{
  position:fixed;
  bottom:2rem;
  left:50%;
  transform:translateX(-50%);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.75rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
  pointer-events:none;
  animation:introPulse 2s ease-in-out infinite;
}
@keyframes introPulse{
  0%,100%{opacity:.3}
  50%{opacity:.8}
}

.nav{
  position:fixed;left:0;right:0;top:1rem;z-index:50;
  padding:0 1rem;
  animation:dropIn .6s cubic-bezier(.16,1,.3,1) both;
}
@media (min-width:640px){.nav{padding:0 1.5rem}}
@media (min-width:1024px){.nav{padding:0 2rem}}

.nav-inner{
  max-width:72rem;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.375rem;
  border:1px solid var(--border);border-radius:10px;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.nav-right{display:flex;align-items:center;gap:.25rem}

.brand{
  display:flex;align-items:center;justify-content:center;
  padding:.5rem .75rem;border-radius:6px;
  font-size:1.25rem;line-height:1;letter-spacing:.02em;
  text-decoration:none;
  transition:background-color .4s cubic-bezier(.32,.72,0,1);
}
.brand:hover{background:var(--hover)}

.nav-links{display:none;align-items:center;gap:.125rem}
@media (min-width:768px){.nav-links{display:flex}}

.nav-link{
  display:flex;align-items:center;justify-content:center;
  padding:.625rem .875rem;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;text-transform:uppercase;letter-spacing:.18em;
  color:var(--muted);text-decoration:none;
  transition:background-color .4s cubic-bezier(.32,.72,0,1),color .4s cubic-bezier(.32,.72,0,1);
}
.nav-link:hover{background:var(--soft);color:var(--fg)}
.nav-link[aria-current="page"]{background:var(--active);color:var(--fg)}

.divider{display:none;width:1px;height:1.25rem;margin:0 .25rem;background:var(--border)}
@media (min-width:768px){.divider{display:block}}

.icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:2.25rem;height:2.25rem;padding:0;
  border-radius:6px;color:var(--muted);
  transition:background-color .4s cubic-bezier(.32,.72,0,1),color .4s cubic-bezier(.32,.72,0,1);
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn svg{width:1rem;height:1rem}

#musicBtn[aria-pressed="true"]{color:var(--fg);background:var(--active)}
#musicBtn[aria-pressed="true"] svg{animation:musicPulse 1.6s ease-in-out infinite}

@keyframes musicPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

.md-only{display:none !important}
@media (min-width:768px){.md-only{display:flex !important}}
.md-hide{display:flex}
@media (min-width:768px){.md-hide{display:none}}

.mobile-menu{
  display:none;flex-direction:column;gap:.125rem;
  max-width:72rem;margin:.5rem auto 0;padding:.375rem;
  border:1px solid var(--border);border-radius:10px;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.mobile-menu.open{display:flex}
.mobile-menu .nav-link{justify-content:flex-start;padding:.75rem .875rem}
@media (min-width:768px){.mobile-menu{display:none}}

.view{display:none}
.view.active{display:block}

.hero{
  position:relative;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:6rem 0 3rem;
}
.container{width:100%;max-width:80rem;margin:0 auto;padding:0 1rem}
@media (min-width:640px){.container{padding:0 1.5rem}}
@media (min-width:1024px){.container{padding:0 2rem}}

.hero-inner{display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center}
@media (min-width:640px){.hero-inner{gap:2rem}}
.hero-logo{width:auto;height:clamp(8rem,26vw,14rem);object-fit:contain}
.hero-copy{
  max-width:48rem;margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10px;line-height:1.625;color:var(--fg);
}
@media (min-width:640px){.hero-copy{font-size:12px}}
@media (min-width:768px){.hero-copy{font-size:14px}}

.affiliations{position:relative;padding:6rem 0;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:center;margin:0 0 4rem}
.section-title{display:flex;align-items:center;margin:0;font-size:1.875rem;font-weight:300;line-height:1.1}
@media (min-width:640px){.section-title{font-size:2.25rem}}
@media (min-width:768px){.section-title{font-size:3rem}}
.bracket{flex:none;width:2.5rem;height:2.5rem;border:0 solid var(--bracket)}
.bracket.left{border-left-width:1px;border-top-width:1px;border-bottom-width:1px}
.bracket.right{border-right-width:1px;border-top-width:1px;border-bottom-width:1px}
@media (min-width:640px){.bracket{width:3rem;height:3rem}}
@media (min-width:768px){.bracket{width:3.5rem;height:3.5rem}}

.aff-grid{display:grid;grid-template-columns:1fr;gap:1.5rem;max-width:80rem;margin:0 auto}
@media (min-width:640px){.aff-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.aff-grid{grid-template-columns:repeat(3,1fr)}}

.aff-card{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:100%;max-width:24rem;height:30rem;
  margin:0 auto;padding:1rem;
  border:1px solid var(--card-border);
  background:var(--card-bg-soft);
  -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);
  box-shadow:0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -4px rgba(0,0,0,.10);
}
.aff-card .plus{position:absolute;width:1.5rem;height:1.5rem;color:var(--plus);pointer-events:none}
.plus.tl{top:-.75rem;left:-.75rem}.plus.bl{bottom:-.75rem;left:-.75rem}
.plus.tr{top:-.75rem;right:-.75rem}.plus.br{bottom:-.75rem;right:-.75rem}
.aff-face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1rem;text-align:center;
  transition:opacity .25s ease,transform .25s ease;
}
.aff-front{opacity:1}
.aff-back{opacity:0}
.aff-card:hover .aff-front,
.aff-card:focus-within .aff-front{opacity:0;transform:translateY(-1rem)}
.aff-card:hover .aff-back,
.aff-card:focus-within .aff-back{opacity:1;transform:translateY(-1rem)}
.aff-icon{width:3rem;height:3rem;color:var(--fg);opacity:.7}
@media (min-width:640px){.aff-icon{width:3.5rem;height:3.5rem}}
@media (min-width:768px){.aff-icon{width:4rem;height:4rem}}
.aff-back img{width:18rem;height:18rem;object-fit:contain}
@media (min-width:640px){.aff-back img{width:20rem;height:20rem}}
@media (min-width:768px){.aff-back img{width:14rem;height:14rem}}
.aff-caption{margin:1rem 0 0;font-size:.875rem;font-weight:300;line-height:1.5}
@media (min-width:640px){.aff-caption{font-size:1rem}}

.hall-page {
  min-height: 100dvh;
  padding: 8rem 1.5rem 4rem;
  max-width: 72rem;
  margin: 0 auto;
}
.hall-header {
  text-align: center;
  margin-bottom: 4rem;
}
.hall-title {
  font-size: 3rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  margin: 0 0 0.5rem;
  color: var(--fg);
}
.hall-divider {
  width: 40px;
  height: 1px;
  background: var(--muted);
  margin: 0 auto 1rem;
}
.hall-subtitle {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.fame-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
}
@media (min-width: 640px) {
  .fame-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1024px) {
  .fame-grid { grid-template-columns: repeat(3, 1fr); }
}
.fame-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #111;
  aspect-ratio: 16/11;
  border: 1px solid var(--border);
  transition: border-color 0.3s ease, transform 0.3s ease;
}
.fame-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
}
.fame-card-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.fame-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0) 100%);
  z-index: 1;
}
.fame-card-content {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 1.25rem;
}
.fame-card-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}
.fame-card-avatar {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.2);
  background: #222;
  flex: none;
}
.fame-card-avatar-wrap{
  position:relative;
  width:2.5rem;
  height:2.5rem;
  flex:none;
}
.fame-card-avatar-wrap .fame-card-avatar{width:100%;height:100%}
.fame-card-dot{
  position:absolute;right:-1px;bottom:-1px;
  width:.7rem;height:.7rem;border-radius:50%;
  background:var(--offline);border:2px solid #111;
}
.fame-card-dot[data-status="online"]{background:var(--online)}
.fame-card-dot[data-status="idle"]{background:var(--idle)}
.fame-card-dot[data-status="dnd"]{background:var(--dnd)}
.fame-card-status{
  font-size:10px;margin:.5rem 0 0;color:rgba(255,255,255,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fame-card-status[data-status="online"]{color:var(--online)}
.fame-card-status[data-status="idle"]{color:var(--idle)}
.fame-card-status[data-status="dnd"]{color:var(--dnd)}
.fame-card-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.fame-card-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: #fff;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fame-card-handle {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  margin: 0;
}
.fame-card-bio {
  font-size: 11px;
  color: rgba(255,255,255,0.85);
  margin: 0.25rem 0 0.85rem;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fame-card-tags {
  display: flex;
  gap: 0.4rem;
}
.fame-card-tag {
  width: 0.85rem;
  height: 0.85rem;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 2px;
}

.members-page{
  min-height:100dvh;
  padding:7rem 1rem 4rem;
  display:grid;
  grid-template-columns:1fr;
  gap:2rem;
  max-width:1400px;
  margin:0 auto;
}

  .members-page{
    grid-template-columns:280px 1fr 80px;
    align-items:center;gap:3rem;padding-top:5rem;
  }
}

.identity-panel{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:1.25rem;
  animation:fadeUp .8s cubic-bezier(.16,1,.3,1) both;
}

  .identity-panel{align-items:flex-start;text-align:left}
}
.avatar-wrapper{position:relative;width:6rem;height:6rem;flex:none}
.avatar-wrapper::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1px dashed var(--border);animation:spin 30s linear infinite;
}
.avatar-wrapper::after{
  content:"";position:absolute;inset:.35rem;border-radius:50%;
  border:1px solid var(--border);
}
.avatar{
  position:relative;z-index:1;
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;background:var(--panel);
  border:1px solid var(--border);

.avatar-deco{

  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
  z-index:2;
  display:none;
}
.avatar-deco.is-on{display:block}

.avatar-wrapper .presence-dot{
  position:absolute;z-index:3;

  border:3px solid var(--bg);background:var(--offline);
  transition:background-color .3s;
}
.avatar-wrapper .presence-dot[data-status="online"]{background:var(--online)}
.avatar-wrapper .presence-dot[data-status="idle"]{background:var(--idle)}

.member-role{

.carousel-container{
  position:relative;width:100%;height:500px;
  perspective:1200px;transform-style:preserve-3d;
  animation:fadeUp .8s .1s cubic-bezier(.16,1,.3,1) both;
}

.carousel{position:relative;width:100%;height:100%;transform-style:preserve-3d}

.carousel-card{
  position:absolute;top:50%;left:50%;
  width:90%;max-width:800px;
  aspect-ratio:16/9;margin:0;
  transform-origin:center center;
  border-radius:16px;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  overflow:hidden;
  transition:transform .7s cubic-bezier(.25,.46,.45,.94),
             opacity .7s cubic-bezier(.25,.46,.45,.94),
             box-shadow .7s ease;

<style id="lbfx">
/* ═══ lostboys intro + ASCII smoke background (replaces the old ASCII-art engine) ═══ */

/* smoke layer: fades in as the logo fills, then lives on as the site background */
#introOverlay #lbSmoke{position:absolute;inset:0;opacity:0;transition:opacity 2.4s ease}
#introOverlay.lb-ready #lbSmoke{opacity:1}
#introOverlay #asciiCanvas{left:0;top:0;width:100%;height:100%;transform:none;will-change:auto}

/* logo */
#lbLogo{
  position:absolute;left:50%;top:50%;z-index:1;
  width:min(62vw,760px);height:auto;overflow:visible;
  transform:translate(-50%,-50%);translate:0 0;
  pointer-events:none;
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  transition:opacity .9s ease, filter 1.6s ease;
}
#introOverlay.lb-filled #lbLogo{filter:drop-shadow(0 0 18px rgba(255,255,255,.14))}

#lbLogo .lb-stroke{
  fill:none;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.7));
  transition:opacity 1s ease, stroke-width 1s ease;
}
#introOverlay.lb-filled #lbLogo .lb-stroke{opacity:.35;stroke-width:1}
#lbMetal{opacity:0;transition:opacity 1.1s ease}
#introOverlay.lb-filled #lbMetal{opacity:1}

/* the tag is the HOME background; on Hall of Fame / Members it steps aside and only the smoke stays */
#introOverlay.is-leaving #lbLogo,
#introOverlay.is-bg #lbLogo{opacity:0}
html[data-route="/"] #introOverlay.is-leaving #lbLogo,
html[data-route="/"] #introOverlay.is-bg #lbLogo{opacity:1}

/* hint appears once the logo has filled */
#introOverlay .intro-skip-hint{animation-delay:4.4s}


/* smoke must read clearly behind the Hall of Fame / Members cards too */
html:not([data-route="/"]) #introOverlay.is-bg #asciiCanvas,html:not([data-route="/"]) #introOverlay.is-leaving #asciiCanvas{opacity:.95}
html:not([data-route="/"]) #introOverlay.is-bg .intro-scrim,html:not([data-route="/"]) #introOverlay.is-leaving .intro-scrim{opacity:.08}

<style id="hofx">
/* ═══ Hall of Fame: reactive cards + expanding profile modal ═══ */
@property --hof-ang{syntax:"<angle>";inherits:false;initial-value:0deg}

/* ── cards ── */
.fame-grid .fame-card{
  --rx:0deg;--ry:0deg;--tx:0;--ty:0;--px:50%;--py:50%;
  cursor:pointer;

.fame-card.hof-src{opacity:0;transition:none!important}
.fame-card-bg{transition:transform .35s ease-out,filter .4s ease;transform:scale(1.04)}
.fame-card-avatar-wrap{transition:transform .35s ease-out}

.fame-card .hof-foil{
  position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .35s ease;
  background:
    radial-gradient(circle 190px at var(--px) var(--py),rgba(255,255,255,.28),transparent 70%),
    linear-gradient(115deg,transparent calc(var(--px) - 26%),rgba(255,255,255,.16) calc(var(--px) - 6%),rgba(190,205,255,.2) var(--px),rgba(255,255,255,.12) calc(var(--px) + 6%),transparent calc(var(--px) + 26%));
  mix-blend-mode:overlay;
}
.fame-card .hof-ring{
  position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;padding:1.5px;opacity:0;transition:opacity .4s ease;
  background:conic-gradient(from var(--hof-ang),transparent 0 62%,rgba(255,255,255,.95) 82%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:hofSpin 3.2s linear infinite;
}
.fame-card .hof-rank{
  position:absolute;top:14px;right:18px;z-index:3;pointer-events:none;
  font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.24em;color:rgba(255,255,255,.55);
  text-shadow:0 1px 8px rgba(0,0,0,.6);transition:color .3s,transform .5s var(--spring);
}
.fame-card .hof-rank::before{content:"HOF ";opacity:.55}
.fame-card .hof-open-hint{
  position:absolute;left:50%;bottom:14px;z-index:3;pointer-events:none;translate:-50% 8px;opacity:0;
  font:500 9px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7);
  transition:opacity .35s ease,translate .5s var(--spring);
}
.fame-card-dot[data-status="online"]{animation:hofPing 2.2s ease-out infinite}

@media (hover:hover) and (pointer:fine){
  .fame-grid .fame-card:hover{
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-6px) scale(1.025);
    transition:transform .14s ease-out,border-color .3s,box-shadow .5s,opacity .25s;
    border-color:rgba(255,255,255,.3);
    box-shadow:0 34px 70px -28px rgba(0,0,0,.95),0 0 60px -20px rgba(255,255,255,.18);
  }
  .fame-card:hover .hof-foil,.fame-card:hover .hof-ring,.fame-card:focus-visible .hof-ring{opacity:1}
  .fame-card:hover .fame-card-bg{transform:scale(1.12) translate(calc(var(--tx)*-9px),calc(var(--ty)*-7px));filter:saturate(1.15) contrast(1.05)}
  .fame-card:hover .fame-card-avatar-wrap{transform:translate(calc(var(--tx)*6px),calc(var(--ty)*5px)) scale(1.06)}
  .fame-card:hover .hof-rank{color:#fff;transform:translateY(2px)}
  .fame-card:hover .hof-open-hint{opacity:1;translate:-50% 0}
}

/* ── modal ── */
.hof-modal{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:10px;overscroll-behavior:contain}
.hof-modal[hidden]{display:none}
.hof-scrim{
  position:absolute;inset:0;opacity:0;transition:opacity .5s ease;cursor:zoom-out;
  background:radial-gradient(ellipse at 50% 40%,rgba(5,6,6,.42),rgba(5,6,6,.82));
  -webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);
}
.hof-modal.on .hof-scrim{opacity:1}
.hof-stage{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.2vw,28px);max-width:100%}
.hof-nav{
  flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:22px;line-height:1;
  opacity:0;transform:scale(.7);transition:opacity .4s ease .25s,transform .5s var(--spring) .25s,background .2s;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.hof-modal.on .hof-nav{opacity:1;transform:none}
.hof-nav:hover{background:rgba(255,255,255,.16)}
.hof-nav:active{transform:scale(.92)}

.hof-wrap{
  --wx:0deg;--wy:0deg;
  position:relative;flex:0 1 auto;
  transform:perspective(1100px) rotateX(var(--wx)) rotateY(var(--wy));
  transition:transform .5s var(--spring);
  filter:drop-shadow(0 40px 60px rgba(0,0,0,.65)) drop-shadow(0 0 40px rgba(255,255,255,.05));
}
.hof-wrap.live{transition:transform .12s ease-out}
.hof-sheet{
  --sc:#80848e;--gx:50%;--gy:0%;
  position:relative;width:min(440px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:hidden auto;scrollbar-width:none;
  border-radius:36px;color:#fafafa;outline:none;

.hof-glare{position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;mix-blend-mode:overlay;
  background:radial-gradient(circle 280px at var(--gx) var(--gy),rgba(255,255,255,.3),transparent 70%)}

.hof-banner{position:relative;height:168px;overflow:hidden;background:#0d0e10}

  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.12) 0 1px,transparent 1px 3px);

.hof-x{
  position:absolute;top:14px;right:14px;z-index:7;width:34px;height:34px;border-radius:50%;

  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);

.hof-av{position:relative;width:92px;height:92px;border-radius:50%;padding:4px;margin-bottom:12px;

.hof-name{
  margin:0;font-size:clamp(1.7rem,6vw,2.2rem);font-weight:600;letter-spacing:-.035em;line-height:1.05;min-height:1.05em;
  background:linear-gradient(110deg,#fff 30%,#a1a1aa,#fff 55%,#d4d4d8 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;

.hof-handle{margin:5px 0 0;font:400 12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;color:rgba(255,255,255,.5)}

.hof-act{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 14px 10px 10px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}

.hof-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.09);gap:1px}
.hof-stats div{display:flex;flex-direction:column;gap:7px;padding:12px 14px;background:#101114}
.hof-stats small{font:600 8.5px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.24em;color:rgba(255,255,255,.4);text-transform:uppercase}

.hof-actions{display:flex;gap:10px;margin-top:18px}
.hof-btn{
  flex:1;display:grid;place-items:center;height:46px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.02em;text-decoration:none;
  color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);transition:transform .35s var(--spring),background .2s,color .2s;

.hof-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}

}

<script>
/* ═════════════ lostboys intro: tag outline draws → brushed-steel fill + glint → ASCII smoke.
   After the click the same overlay drops behind the site (see the enter-script below) and the smoke
   keeps drifting as the background of Home and Hall of Fame. The tag stays on Home only. ═════════════ */
(function () {
  var overlay = document.getElementById('introOverlay'), cv = document.getElementById('asciiCanvas'),
      svg = document.getElementById('lbLogo'), strokes = document.getElementById('lbStrokes'),
      shape = document.getElementById('lbShapePath'), glintBar = document.getElementById('lbGlint');
  if (!overlay || !cv || !svg || !strokes || !shape || !glintBar) return;

      var c = e.target.closest && e.target.closest('.fame-card'); if (c) { e.preventDefault(); hofOpen(c); }
    });
  }

  function hofBuild() {
    if (hofModal) return;
    hofModal = document.createElement('div');
    hofModal.className = 'hof-modal'; hofModal.hidden = true;
    hofModal.innerHTML =
      '<div class="hof-scrim"></div>' +
      '<div class="hof-stage">' +
        '<button class="hof-nav" type="button" data-d="-1" aria-label="Previous member">&#8249;</button>' +
        '<div class="hof-wrap"><div class="hof-sheet" role="dialog" aria-modal="true" aria-label="Hall of Fame profile" tabindex="-1">' +
          '<div class="hof-glare"></div>' +
          '<div class="hof-banner"><img class="hof-bannerimg" alt=""></div>' +
          '<div class="hof-tag"><span class="hof-tagtxt">HOF // 01</span><i>_</i></div>' +
          '<button class="hof-x" type="button" aria-label="Close">&times;</button>' +
          '<div class="hof-body">' +
            '<div class="hof-av"><img class="hof-avimg" alt=""><img class="avatar-deco" alt="" aria-hidden="true"><span class="hof-dot"></span></div>' +
            '<h2 class="hof-name"></h2>' +
            '<p class="hof-handle"></p>' +
            '<div><span class="hof-chip"><i></i><span class="hof-chiptxt"></span></span></div>' +
            '<p class="hof-bio"></p>' +
            '<div class="hof-act" hidden><img alt="" hidden><div><small></small><b></b><span></span></div></div>' +
            '<div class="hof-stats"><div><small>Rank</small><b class="hof-s1"></b></div><div><small>Discord since</small><b class="hof-s2"></b></div><div><small>Presence</small><b class="hof-s3"></b></div></div>' +
            '<div class="hof-actions"><a class="hof-btn primary hof-link" target="_blank" rel="noopener noreferrer">Open in Discord</a><button class="hof-btn hof-copy" type="button">Copy ID</button></div>' +
            '<div class="hof-hint">&larr; &rarr; browse &nbsp;&middot;&nbsp; esc close</div>' +
          '</div>' +
        '</div></div>' +
        '<button class="hof-nav" type="button" data-d="1" aria-label="Next member">&#8250;</button>' +
      '</div>';
    document.body.appendChild(hofModal);
    hofWrap = hofModal.querySelector('.hof-wrap'); hofSheet = hofModal.querySelector('.hof-sheet');
    hofModal.querySelectorAll('.hof-body > *').forEach(function (el, i) { el.style.setProperty('--i', i); });

    hofModal.querySelector('.hof-scrim').addEventListener('click', hofClose);
    hofModal.querySelector('.hof-stage').addEventListener('click', function (e) { if (e.target === this) hofClose(); });
    hofModal.querySelector('.hof-x').addEventListener('click', hofClose);
    hofModal.querySelectorAll('.hof-nav').forEach(function (b) { b.addEventListener('click', function () { hofGo(+b.getAttribute('data-d')); }); });
    hofModal.querySelector('.hof-copy').addEventListener('click', function () {
      var b = this, id = HALL_OF_FAME[hofIdx].discordId;
      var ok = function () { b.textContent = 'Copied ✓'; setTimeout(function () { b.textContent = 'Copy ID'; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(id).then(ok, ok); else ok();
    });

    /* pointer: 3D tilt + glare + banner parallax */
    hofModal.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse' || hofReduce.matches || !hofIsOpen) return;
      var r = hofSheet.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      var cx = Math.max(-1, Math.min(1, (e.clientX / innerWidth - .5) * 2)), cy = Math.max(-1, Math.min(1, (e.clientY / innerHeight - .5) * 2));
      hofWrap.classList.add('live');
      hofWrap.style.setProperty('--wx', (-cy * 5).toFixed(2) + 'deg');
      hofWrap.style.setProperty('--wy', (cx * 7).toFixed(2) + 'deg');
      hofSheet.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
      hofSheet.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
      hofSheet.querySelector('.hof-banner').style.setProperty('--bx', cx);
      var bi = hofSheet.querySelector('.hof-bannerimg'); bi.style.translate = (-cx * 8).toFixed(1) + 'px ' + (-cy * 5).toFixed(1) + 'px';
    });
    hofModal.addEventListener('pointerleave', function () {
      hofWrap.classList.remove('live'); hofWrap.style.setProperty('--wx', '0deg'); hofWrap.style.setProperty('--wy', '0deg');
    });

    /* swipe left / right on touch */
    var sx = 0, sy = 0, st = false;
    hofSheet.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; sx = e.clientX; sy = e.clientY; st = true; });
    hofSheet.addEventListener('pointerup', function (e) {
      if (!st) return; st = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) hofGo(dx < 0 ? 1 : -1);
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5 && hofSheet.scrollTop <= 0) hofClose();
    });

    document.addEventListener('keydown', function (e) {
      if (!hofIsOpen) return;
      if (e.key === 'Escape') { e.preventDefault(); hofClose(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); hofGo(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); hofGo(-1); }
      else if (e.key === 'Tab') {                              // keep focus inside the dialog
        var f = Array.prototype.filter.call(hofModal.querySelectorAll('button,a[href]'), function (n) { return n.offsetParent !== null; });
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === hofSheet)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    window.addEventListener('hashchange', function () { if (hofIsOpen) hofClose(true); });
  }

  /* fill the modal from the member + whatever presence data we have (called again when presence updates) */
  function hofFill(i, scramble) {
    if (!hofModal) return;
    var m = HALL_OF_FAME[i], id = m.discordId, d = presenceCache[id], st = d ? d.discord_status : 'offline', card = hofCards[i];
    var q = function (s) { return hofModal.querySelector(s); };
    var name = displayName(m, d), handle = handleText(m, d);

    hofSheet.setAttribute('data-s', st);
    var bg = card.querySelector('.fame-card-bg').getAttribute('src');
    var bi = q('.hof-bannerimg'); if (bi.getAttribute('src') !== bg) bi.src = bg;
    var av = card.querySelector('.fame-card-avatar').getAttribute('src');
    var ai = q('.hof-avimg'); if (ai.getAttribute('src') !== av) ai.src = av;
    applyDeco(q('.avatar-deco'), d && d.discord_user);

    var nm = q('.hof-name');
    if (scramble) hofScramble(nm, name, 650); else { nm.__scr = (nm.__scr || 0) + 1; nm.textContent = name; }
    q('.hof-handle').textContent = handle;
    q('.hof-tagtxt').textContent = 'HOF // ' + pad(i + 1);
    q('.hof-chiptxt').textContent = statusLabel(st);
    q('.hof-bio').textContent = bioText(m, d);

    var act = null;
    if (d) {
      if (d.listening_to_spotify && d.spotify) act = { k: 'Listening to', t: d.spotify.song, s: d.spotify.artist, img: d.spotify.album_art_url };
      else if (d.activities) {
        var a = d.activities.filter(function (x) { return x.type !== 4; })[0];
        if (a) act = { k: ['Playing', 'Streaming', 'Listening to', 'Watching', '', 'Competing in'][a.type] || 'Now', t: a.name || '', s: a.details || a.state || '', img: null };
      }
    }
    var ab = q('.hof-act'); ab.hidden = !act;
    if (act) {
      var im = ab.querySelector('img'); im.hidden = !act.img; if (act.img) im.src = act.img;
      ab.querySelector('small').textContent = act.k.toUpperCase();
      ab.querySelector('b').textContent = act.t; ab.querySelector('span').textContent = act.s;
      ab.querySelector('small').style.color = act.img ? '#1db954' : 'rgba(255,255,255,.55)';
    }
    q('.hof-s1').textContent = '#' + pad(i + 1);
    q('.hof-s2').textContent = hofSince(id);
    q('.hof-s3').textContent = statusLabel(st);
    q('.hof-link').href = 'https://discord.com/users/' + encodeURIComponent(id);
  }
  function hofRefresh() { if (hofIsOpen && hofIdx >= 0) hofFill(hofIdx, false); }

  function hofInset(card, sheetRect) {
    var r = card.getBoundingClientRect(), s = sheetRect;
    var f = function (v) { return Math.max(0, v).toFixed(1) + 'px'; };
    return 'inset(' + f(r.top - s.top) + ' ' + f(s.right - r.right) + ' ' + f(s.bottom - r.bottom) + ' ' + f(r.left - s.left) + ' round 30px)';
  }

  function hofOpen(card) {
    if (hofIsOpen || hofBusy) return;
    hofBuild();
    hofIdx = hofCards.indexOf(card); if (hofIdx < 0) return;
    hofBack = card; hofIsOpen = true; hofBusy = true;
    hofFill(hofIdx, true);
    hofModal.hidden = false;
    var sc = window.innerWidth - document.documentElement.clientWidth;
    document.body.classList.add('hof-lock'); if (sc > 0) document.body.style.paddingRight = sc + 'px';
    void hofModal.offsetWidth;
    var sr = hofSheet.getBoundingClientRect(), from = hofInset(card, sr);
    card.classList.add('hof-src');
    hofModal.classList.add('on');
    hofSheet.focus({ preventScroll: true });
    var fin = function () { hofBusy = false; hofSheet.style.clipPath = ''; };
    if (hofReduce.matches) return fin();
    var a = hofSheet.animate(
      [{ clipPath: from, transform: 'scale(.97)' }, { clipPath: 'inset(0px 0px 0px 0px round 36px)', transform: 'scale(1)' }],
      { duration: 640, easing: HOF_EASE });
    a.onfinish = a.oncancel = fin;
  }

  function hofClose(instant) {
    if (!hofIsOpen || (hofBusy && instant !== true)) return;
    hofIsOpen = false; hofBusy = true;
    hofModal.classList.remove('on');
    hofWrap.classList.remove('live'); hofWrap.style.setProperty('--wx', '0deg'); hofWrap.style.setProperty('--wy', '0deg');
    var card = hofCards[hofIdx];
    var done = function () {
      hofModal.hidden = true; hofBusy = false;
      document.body.classList.remove('hof-lock'); document.body.style.paddingRight = '';
      hofCards.forEach(function (c) { c.classList.remove('hof-src'); });
      if (hofBack && hofBack.offsetParent !== null) hofBack.focus({ preventScroll: true });
    };
    var vis = card && card.offsetParent !== null;
    if (hofReduce.matches || instant === true || !vis) return done();
    var sr = hofSheet.getBoundingClientRect(), to = hofInset(card, sr);
    var a = hofSheet.animate(
      [{ clipPath: 'inset(0px 0px 0px 0px round 36px)', transform: 'scale(1)' }, { clipPath: to, transform: 'scale(.97)' }],
      { duration: 460, easing: 'cubic-bezier(.6,0,.25,1)', fill: 'forwards' });
    a.onfinish = a.oncancel = function () { done(); try { a.cancel(); } catch (e) {} };
  }

  function hofGo(dir) {
    if (!hofIsOpen || hofBusy) return;
    var n = hofCards.length; if (n < 2) return;
    hofBusy = true;
    var prev = hofCards[hofIdx];
    hofIdx = (hofIdx + dir + n) % n;
    var next = hofCards[hofIdx];
    prev.classList.remove('hof-src'); next.classList.add('hof-src'); hofBack = next;

    var body = hofSheet.querySelector('.hof-body'), ban = hofSheet.querySelector('.hof-banner');
    var swap = function () {
      hofFill(hofIdx, true); hofSheet.scrollTop = 0;
      if (hofReduce.matches) { hofBusy = false; return; }
      ban.animate([{ opacity: .2, transform: 'translateX(' + (dir * 30) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: HOF_EASE });
      var a = body.animate([{ opacity: 0, transform: 'translateX(' + (dir * 46) + 'px)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 520, easing: HOF_EASE });
      a.onfinish = function () { hofBusy = false; };
    };
    if (hofReduce.matches) return swap();
    var o = body.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(' + (-dir * 46) + 'px)', filter: 'blur(8px)' }], { duration: 170, easing: 'ease-in', fill: 'forwards' });
    var ob = ban.animate([{ opacity: 1 }, { opacity: .2 }], { duration: 170, fill: 'forwards' });
    o.onfinish = function () { o.cancel(); ob.cancel(); swap(); };
  }

  buildHallOfFame();
  hofEnhance();
  buildStage();
  render();
  applyRoute();
})();
</script>
<script>
document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('.aff-card,.grid-card,.fame-card');if(!t)return;var r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});
</script>
<style>
.bgban{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:0;transform:scale(1.07);pointer-events:none;transition:opacity .75s ease,transform 1.4s cubic-bezier(.16,1,.3,1)}
.bgban::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,6,6,.3),rgba(5,6,6,.72))}
.bgban.on{opacity:.8;transform:scale(1)}
html.banner-bg .intro-overlay.is-bg canvas{opacity:.1!important}
@media (prefers-reduced-motion:reduce){.bgban{transition:opacity .2s;transform:none}}
</style>
<script>
/* hovering a member banner turns it into the page background; leaving fades back to the ASCII */
(function () {
  var L = [document.createElement('div'), document.createElement('div')], k = 0, cur = null, root = document.documentElement;
  L.forEach(function (d) { d.className = 'bgban'; d.setAttribute('aria-hidden', 'true'); document.body.appendChild(d); });
  function reset() { cur = null; L.forEach(function (d) { d.classList.remove('on'); }); root.classList.remove('banner-bg'); }
  function src(c) { var im = c.querySelector('.fame-card-bg') || c.querySelector('img'); return im && (im.currentSrc || im.src); }
  document.addEventListener('pointerover', function (e) {
    if (e.pointerType === 'touch') return;
    var c = e.target.closest && e.target.closest('.carousel-card,.fame-card');
    if (c === cur) return;
    if (!c) { reset(); return; }
    var u = src(c); if (!u) return;
    cur = c; k ^= 1;
    L[k].style.backgroundImage = 'url("' + u.replace(/"/g, '%22') + '")';
    L[k].classList.add('on'); L[k ^ 1].classList.remove('on'); root.classList.add('banner-bg');
  }, { passive: true });
  root.addEventListener('mouseleave', reset);
})();
</script>
